results_dir: ???
encryption_key: nvidia_tao

# InternVideo2-CLIP L14 defaults follow OpenGVLab
# InternVideo2/multi_modality/scripts/pretraining/clip/L14/config.py where the
# setting maps directly into TAO. Local run specs should still fill paths,
# batch size, GPU count, and warmup_steps for the target dataset.

model:
  type: internvideo2-clip-l14
  image_size: 224
  num_frames: 8            # single source of truth; dataset/query num_frames interpolate from here
  canonicalize_text: false
  freeze_vision_encoder: true
  freeze_text_encoder: true
  # internvideo2_vtc: logit scale = log(100) ~= 4.6052, bias = 0.0.
  # Leave both null to auto-set from train.loss_type.
  init_logit_scale: 4.605170185988092
  init_logit_bias: 0.0

  # --- Weight sources ---------------------------------------------------------
  # The InternVideo2-CLIP architecture is vendored in-repo; weights load from
  # the ambient HF cache (set HF_HOME, e.g. /workspace/alicli).
  #
  # Pretrained run (recommended): vision encoder + CLIP head come from the HF
  # repo below; the text tower (MobileCLIP) must be provided separately.
  internvideo2clip_hf_id: OpenGVLab/InternVideo2_distillation_models
  text_encoder: ???        # REQUIRED for pretrained: MobileCLIP local .pt path OR an HF id (file: mobileclip_blt.pt)
  vision_encoder: null     # null -> resolved from internvideo2clip_hf_id (or set a local .bin / HF id)
  clip_head: null          # null -> resolved from internvideo2clip_hf_id (applied last; overwrites overlapping keys)
  pretrained_ckpt: null    # set to a local .pth COMPLETE model to override all component weights above
  #
  # Train from scratch (random init): set ALL of internvideo2clip_hf_id,
  # vision_encoder, text_encoder, clip_head, and pretrained_ckpt to null.
  # (Honored once InternVideo2CLIP model code is migrated into TAO; until then
  # an all-null config raises ValueError in the asset resolver.)

  # --- InternVideo2 perf kernels (require flash-attn in the env) ---------------
  use_flash_attn: false
  use_fused_rmsnorm: false
  use_fused_mlp: false

dataset:
  seed: 42
  pin_memory: true
  train:
    type: video_text
    # The shared video_text block is defined once (anchor &vt) and reused for
    # val/inference, which override only the deltas (e.g. split).
    video_text: &vt
      metadata: ???        # canonical nested per-video chunks JSON (format auto-detected)
      data_root: null
      split: train
      path_prefix_mapping: {}
      caption_fields: [caption]
      # first | random | all | one_per_field. 'all'/'one_per_field' are
      # train-only and require train.loss_type=internvideo2_vtc.
      caption_mode: first
      idx_mode: sample_id
      idx_field: null
      anomaly_only: false
      num_frames: ${model.num_frames}
    batch_size: 4
    num_workers: 12
  val:
    type: video_text
    video_text:
      <<: *vt
      split: test
    batch_size: 4
    num_workers: 12
  inference:
    type: video_text
    video_text:
      <<: *vt
      split: test
    batch_size: 4
    num_workers: 12
  # Evaluation metric mode (retrieval | classification) + excluded categories.
  metrics:
    mode: retrieval
    exclude_categories: [Normal, Abnormal]
  augmentation:
    scale: [1.0, 1.0]
    color_jitter: []
    grayscale: 0.0

train:
  num_epochs: 3
  checkpoint_interval: 1
  checkpoint_interval_unit: epoch
  resume_training_checkpoint_path: null
  grad_checkpointing: false
  grad_clip_norm: null
  precision: bf16
  pretrained_model_path: null
  loss_type: internvideo2_vtc
  seed: 42
  num_nodes: 1
  num_gpus: 4
  gpu_ids: [0, 1, 2, 3]
  distributed_strategy: ddp
  validation_interval: 1
  val_check_interval: null
  optim:
    optimizer_type: adamw
    vision_lr: 0.0004
    text_lr: 0.0004
    betas: [0.9, 0.98]
    eps: 1e-06
    weight_decay: 0.2
    # OpenGVLab L14 uses warmup_epochs=0.6. Convert this to warmup_steps
    # for the target dataset/global batch size when preparing a run spec.
    warmup_steps: ???
    scheduler: cosine

# Parameter-efficient fine-tuning (LoRA) + geometry-preserving regularization.
# Both are disabled by default (standard full fine-tuning). Uncomment to enable;
# see experiment_spec_lora.yaml for a complete, ready-to-edit LoRA example.
# peft:
#   enabled: true
#   method: lora
#   vision:                      # InternVideo2 vision tower (24 blocks)
#     mode: lora
#     target_modules: [qkv, proj]
#     num_last_blocks: 3         # 0 = all blocks
#     rank: 8
#     alpha: 16
#     dropout: 0.05
#   text:                        # MobileCLIP text tower (12 blocks)
#     mode: frozen
#     target_modules: [qkv_proj, out_proj]
#     num_last_blocks: 3
#     rank: 8
#     alpha: 16
#     dropout: 0.05
# regularization:                # frozen-teacher preservation losses (optional)
#   enabled: false
#   embedding_mse_weight: 0.05
#   cosine_weight: 0.05
#   similarity_weight: 0.10

evaluate:
  checkpoint: ???
  batch_size: 4
  num_workers: 12
  num_gpus: 4
  gpu_ids: [0, 1, 2, 3]

inference:
  checkpoint: ???
  results_dir: null
  num_gpus: 4
  gpu_ids: [0, 1, 2, 3]
  batch_size: 4
  num_workers: 12
  mode: embeddings          # embeddings | retrieval
  overwrite_embeddings: false
  video_embeddings_file: null
  text_embeddings_file: null
  # Ranking config for mode=retrieval (shared with evaluate).
  search:
    enabled: false
    search_metric: cosine   # cosine | knn
    top_k: 5                # corpus matches per query
    normalize: true
  query:
    input_texts: []         # inline text queries
    input_videos: []        # inline video-file queries
    text_file: null         # optional file, one prompt per line
    num_frames: ${model.num_frames}

export:
  checkpoint: ???
  onnx_file: ???
  encoder_type: separate
  input_height: 224
  input_width: 224
  input_channel: 3
  batch_size: 1
  opset_version: 23
  gpu_id: 0
  on_cpu: false
  verbose: false
