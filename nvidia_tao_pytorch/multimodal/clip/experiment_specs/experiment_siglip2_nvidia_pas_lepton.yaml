results_dir: /workspace/thtang/siglip2_results

train:
  num_epochs: 20
  num_gpus: 8
  num_nodes: 1
  gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
  checkpoint_interval: 1
  resume_training_checkpoint_path: null
  grad_checkpointing: false
  grad_clip_norm: 1.0
  precision: fp16
  pretrained_model_path: null
  distributed_strategy: ddp
  loss_type: siglip
  triplet_loss_weight: 0.5
  triplet_margin: 0.2
  optim:
    optimizer_type: adamw
    vision_lr: 1e-6
    text_lr: 1e-6
    scheduler: cosine
    betas: [0.9, 0.95]
    eps: 1e-06
    weight_decay: 1e-4
    warmup_steps: 1000
  validation_interval: 1
  val_check_interval: null

dataset:
  seed: 42
  train:
    type: custom
    balance_query_types: true
    unique_caption_per_batch: false
    datasets:
    - image_dir: /workspace/data/pas/NVIDIA_PAS_TAO_FT/images
      image_list_file: /workspace/data/pas/NVIDIA_PAS_TAO_FT/train_list.txt
      caption_dir: /workspace/data/pas/NVIDIA_PAS_TAO_FT/captions
      caption_file_suffix: .txt
      train_pairs_file: /workspace/data/pas/NVIDIA_PAS_TAO_FT/train_pairs.json
    batch_size: 128
    num_workers: 16
  val:
    datasets:
    - image_dir: /workspace/data/pas/NVIDIA_PAS_TAO_FT/images
      image_list_file: /workspace/data/pas/NVIDIA_PAS_TAO_FT/val_list.txt
      caption_dir: /workspace/data/pas/NVIDIA_PAS_TAO_FT/captions
      caption_file_suffix: .txt
    batch_size: 16
    num_workers: 4

model:
  type: siglip2-so400m-patch16-256
  canonicalize_text: false

evaluate:
  checkpoint: ???
  batch_size: 32

inference:
  checkpoint: ???
  datasets: []
  batch_size: 32

export:
  checkpoint: ???
  onnx_file: ???
  encoder_type: combined
  input_height: 256
  input_width: 256
  batch_size: -1
  opset_version: 17
