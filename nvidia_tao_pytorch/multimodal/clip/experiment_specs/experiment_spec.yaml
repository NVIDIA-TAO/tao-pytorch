results_dir: ???

train:
  num_epochs: 100
  checkpoint_interval: 10
  resume_training_checkpoint_path: null
  grad_checkpointing: false
  grad_clip_norm: null
  precision: fp16
  pretrained_model_path: null
  loss_type: siglip  # siglip or clip
  siglip_loss_dist_impl: gather  # metadata masking supports local or gather
  # none, attribute_match_ignore, attribute_plus_accessory_match_ignore,
  # attribute_match_positive, or attribute_plus_accessory_match_positive
  siglip_loss_mask_mode: none
  compatible_positive_weight: 1.0
  compatible_positive_normalization: per_pair  # per_pair or per_query
  triplet_loss_weight: 0.0  # set > 0 to enable triplet loss
  triplet_margin: 0.2
  pa_loss_weight: 0.0  # set > 0 to enable Partial-negative Alignment
  pa_margin: 0.2
  pa_inverse_temperature: 10.0
  pa_top_ratio: 0.5
  optim:
    optimizer_type: adamw  # adamw, lamb, or sgd
    vision_lr: 1e-4
    text_lr: 1e-4
    betas: [0.9, 0.95]
    eps: 1e-06
    weight_decay: 1e-4
    warmup_steps: 100
  validation_interval: 1  # Run validation every N epochs
  val_check_interval: null  # Or run validation every N steps (takes precedence if set)

dataset:
  seed: 42
  train:
    type: custom  # custom or wds
    balance_query_types: false  # true + per-dataset train_pairs.json balances query types
    unique_caption_per_batch: true  # enforce unique captions when balance_query_types is true
    # Required when siglip_loss_mask_mode is enabled.
    include_attribute_metadata: false
    datasets:
    - image_dir: ???
      caption_dir: ???
      caption_file_suffix: .txt
      image_list_file: null  # Optional: text file listing image filenames
      train_pairs_file: null  # Optional per dataset block; required for that block when balance_query_types is true
      attribute_pairs_file: null  # Optional explicit split-aligned metadata file
    batch_size: 16
    num_workers: 8
  val:
    datasets: []  # Same format as train.datasets
    metadata_match_eval: false  # Multiple datasets require identical metadata vocabularies
    metadata_match_mode: scalar_attributes  # scalar_attributes or scalar_plus_accessories
    batch_size: 16
    num_workers: 8

model:
  type: ???  # siglip2-so400m-patch16-256, c-radio_v3-h, etc.
  canonicalize_text: false

evaluate:
  checkpoint: ???
  datasets: []  # Optional direct PAS export; otherwise uses dataset.val.datasets
  pas_ground_truth_mode: paired_caption  # paired_caption, scalar_attributes, or scalar_plus_accessories
  batch_size: 16

inference:
  checkpoint: ???
  datasets: []  # Same format as train.datasets
  batch_size: 16

export:
  checkpoint: ???
  onnx_file: ???
  encoder_type: combined  # combined or separate
  input_height: 256
  input_width: 256
  batch_size: 1
  opset_version: 17
  # NOTE: NaFlex models (e.g. siglip2-so400m-patch16-naflex) are not supported
  # for ONNX/TRT export due to dynamic patch embeddings that cannot be traced
  # to a static graph. Use a fixed-resolution SigLIP2 variant instead
  # (e.g. siglip2-so400m-patch16-384).
