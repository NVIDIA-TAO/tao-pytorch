encryption_key: tlt_encode

# DINOv3 ViT-L (Phase 2) continual pre-training. Same recipe as ViT-B (Phase 0): single-res 256,
# Sinkhorn centering, Gram OFF baseline. Only the backbone scales to vit_l (1024/24/16).
#
# NOTE on scaling: dinov3 train.py uses strategy='auto' (DDP for multi-GPU, not FSDP) and the
# multi-GPU path is not yet validated for this family (Phase 0 ran single-GPU). ViT-L (~300M)
# fits single-GPU at a small batch, so this spec defaults to num_gpus=1. Multi-GPU DDP/FSDP for
# higher throughput is a follow-up (wire an explicit strategy in train.py + validate).
results_dir: /data/scratch/users/vpraveen/dinov3_vitl_v1
model:
  distill:
    enable: False
    disable_masking: False
    pretrained_non_distill_pl_model_path: null
  centering_method: "sinkhorn"
  backbone:
    teacher_type: "vit_l"
    student_type: "vit_l"
    num_register_tokens: 4
    drop_path_rate: 0.4
    patch_size: 16
    img_size: 256
    rope_theta: 100.0
  head:
    num_layers: 3
    hidden_dim: 2048
    bottleneck_dim: 384
  gram:
    # Gram OFF for the ViT-L baseline (same rationale as ViT-B Phase 0); high-res + Gram is Phase 1.
    enable: False
    w_gram: 0.0
    start_step: 0
    teacher_source: "pretrained"
  lora:
    enable: False

dataset:
  train_dataset:
    images_dir: /data/scratch/users/vpraveen/dinov3_vitl_v1/data
  # ViT-L is ~3.5x ViT-B params; keep the batch modest.
  batch_size: 8
  workers: 8
  transform:
    n_global_crops: 2
    global_crops_scale: [0.32, 1.0]
    global_crops_size: 256
    n_local_crops: 8
    local_crops_scale: [0.05, 0.32]
    local_crops_size: 112

train:
  resume_training_checkpoint_path: null
  # Pretrained DINOv3 ViT-L weights (timm-format vit_large_patch16_dinov3.lvd1689m), mounted in.
  pretrained_model_path: /data/weights/dinov3/vitl16
  cudnn:
    deterministic: False
    benchmark: True
  num_nodes: 1
  num_gpus: 1
  num_epochs: 10
  checkpoint_interval: 1
  layerwise_decay: 1.0
  clip_grad_norm: 3.0
  optim:
    optim: "adamw"
  schedulers:
    learning_rate:
      val_base: "${eval: '5e-5 * (${dataset.batch_size} * ${train.num_gpus} * ${train.num_nodes} / 1024) ** (1/2)'}"
      val_final: 1e-6
      warm_up_steps: 10000
    last_layer_learning_rate:
      val_base: "${eval: '5e-5 * (${dataset.batch_size} * ${train.num_gpus} * ${train.num_nodes} / 1024) ** (1/2)'}"
      val_final: 1e-6
      warm_up_steps: 10000
      freeze_steps: 1250
    weight_decay:
      val_base: 0.04
      val_final: 0.2
    momentum:
      val_base: 0.9999
      val_final: 1.0
    teacher_temperature:
      val_base: 0.07
      val_final: 0.07
      val_start: 0.04
      warm_up_steps: 37500
  num_prototypes: 131072
  results_dir: "${results_dir}/train"
