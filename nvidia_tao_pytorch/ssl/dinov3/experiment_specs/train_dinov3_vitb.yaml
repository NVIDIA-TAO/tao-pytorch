encryption_key: tlt_encode

results_dir: /data/scratch/users/vpraveen/dinov3_vitb_v1
model:
  distill:
    enable: False
    disable_masking: False
    pretrained_non_distill_pl_model_path: null
  # DINOv3 uses Sinkhorn-Knopp (SwAV) centering for the DINO/iBOT teacher outputs.
  centering_method: "sinkhorn"
  backbone:
    teacher_type: "vit_b"
    student_type: "vit_b"
    num_register_tokens: 4
    drop_path_rate: 0.4
    patch_size: 16
    img_size: 256
    rope_theta: 100.0
  head:
    num_layers: 3
    hidden_dim: 2048
    bottleneck_dim: 384
  gram:
    # Gram anchoring is OFF for the baseline: the DINOv3 paper does not use Gram for the
    # smaller backbones (it is a 7B / long-schedule / high-res tool). The code stays intact
    # and gated off; enable it (and set w_gram) only for the deferred high-res phase.
    enable: False
    w_gram: 0.0
    start_step: 0
    teacher_source: "pretrained"
  lora:
    enable: False

dataset:
  train_dataset:
    images_dir: /data/scratch/users/vpraveen/dinov3_vitb_v1/data
  batch_size: 16
  workers: 10
  transform:
    n_global_crops: 2
    global_crops_scale: [0.32, 1.0]
    global_crops_size: 256
    n_local_crops: 8
    local_crops_scale: [0.05, 0.32]
    local_crops_size: 112

train:
  resume_training_checkpoint_path: null
  # Pretrained DINOv3 ViT-B weights (timm-format), mounted into the container.
  pretrained_model_path: /data/weights/dinov3/vitb16
  # xformers memory_efficient_attention has no deterministic backward kernel, so this SSL
  # backbone trains with determinism off (the global default is True). Reproducibility-only;
  # required for the xformers attention path to run its backward.
  cudnn:
    deterministic: False
    benchmark: True
  num_nodes: 1
  num_gpus: 1
  num_epochs: 10
  checkpoint_interval: 1
  # Conservative layerwise decay / clipping for continual pre-training.
  layerwise_decay: 1.0
  clip_grad_norm: 3.0
  optim:
    optim: "adamw"
  schedulers:
    learning_rate:
      # Conservative LR for continual pre-training (avoid catastrophic forgetting).
      val_base: "${eval: '5e-5 * (${dataset.batch_size} * ${train.num_gpus} * ${train.num_nodes} / 1024) ** (1/2)'}"
      val_final: 1e-6
      warm_up_steps: 10000
    last_layer_learning_rate:
      val_base: "${eval: '5e-5 * (${dataset.batch_size} * ${train.num_gpus} * ${train.num_nodes} / 1024) ** (1/2)'}"
      val_final: 1e-6
      warm_up_steps: 10000
      freeze_steps: 1250
    weight_decay:
      val_base: 0.04
      val_final: 0.2
    momentum:
      # High EMA momentum to anchor the teacher during domain adaptation.
      val_base: 0.9999
      val_final: 1.0
    teacher_temperature:
      val_base: 0.07
      val_final: 0.07
      val_start: 0.04
      warm_up_steps: 37500
  num_prototypes: 131072
  results_dir: "${results_dir}/train"
