name: Secret Scan

on:
  pull_request:

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install TruffleHog
        env:
          TRUFFLEHOG_VERSION: v3.96.0
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b "${RUNNER_TEMP}/bin" "${TRUFFLEHOG_VERSION}"
          "${RUNNER_TEMP}/bin/trufflehog" --version

      - name: Scan the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE="$(git merge-base "${BASE_SHA}" HEAD)"
          "${RUNNER_TEMP}/bin/trufflehog" git "file://${PWD}" \
            --since-commit "${BASE}" \
            --results=verified,unknown \
            --fail \
            --no-update \
            --exclude-detectors=lob
